name: CloudSeats CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run backend tests
        run: pytest -v
        working-directory: backend

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute Lowercase Registry Owner
        id: prep
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container images
        run: |
          docker build -t ghcr.io/${{ steps.prep.outputs.owner }}/cloudseats-backend:${{ github.sha }} ./backend
          docker build -t ghcr.io/${{ steps.prep.outputs.owner }}/cloudseats-frontend:${{ github.sha }} ./frontend

      - name: Security Scan Backend with Trivy
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          image-ref: ghcr.io/${{ steps.prep.outputs.owner }}/cloudseats-backend:${{ github.sha }}
          scan-type: 'image'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      - name: Security Scan Frontend with Trivy
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          image-ref: ghcr.io/${{ steps.prep.outputs.owner }}/cloudseats-frontend:${{ github.sha }}
          scan-type: 'image'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      - name: Push images to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ steps.prep.outputs.owner }}/cloudseats-backend:${{ github.sha }}
          docker push ghcr.io/${{ steps.prep.outputs.owner }}/cloudseats-frontend:${{ github.sha }}

  deploy:
    needs: build-scan-push
    # Gated behind repository variable DEPLOY_ENABLED to keep pipeline green when cluster is off
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Compute Lowercase Registry Owner
        id: prep
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Configure kubectl
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config

      - name: Deploy with Helm
        run: |
          helm upgrade --install cloudseats ./helm/cloudseats -n cloudseats --create-namespace \
            --set backend.tag=${{ github.sha }} \
            --set frontend.tag=${{ github.sha }} \
            --set backend.image=ghcr.io/${{ steps.prep.outputs.owner }}/cloudseats-backend \
            --set frontend.image=ghcr.io/${{ steps.prep.outputs.owner }}/cloudseats-frontend
